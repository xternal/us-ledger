left_out:
  - lead: "Posts on Truth Social praising companies days after purchases of their stock, among them those counted by CNN on 16 July 2026"
    why: "No copy of the posts could be saved from Truth Social or the Internet Archive for this check; each needs its post saved before it can be matched."
  - lead: "Micron, praised in an interview with Fox News on 26 March 2026"
    why: "The interview is not in the Daily Compilation of Presidential Documents, and no official transcript was found."
  - lead: "Boeing, before a sale of aircraft to China"
    why: "No official record of the President's words on it was found in the Daily Compilation."
  - lead: "Apple, at the White House on 6 August 2025"
    why: "The compilation gives the time of the remarks as 5:11 a.m., while the remarks open with \"This afternoon\", so the rule for which close comes first cannot be applied; the purchases were after the remarks."
  - lead: "Nvidia, before the semiconductor document signing on 6 August 2026"
    why: "The President did not name Nvidia in the remarks."
