      date: "2026-07-22"
      where: "H.R. 7008 as passed by the House: who the bill covers (section 2, new 5 U.S.C. 13151)"
      text: "``(1) Covered individual.--The term `covered individual' means any of the following: ``(A) A Member of Congress, as defined in section 13101. ``(B) A dependent child (as defined in section 13101) or a spouse of a Member of Congress."
