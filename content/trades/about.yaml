press:
  - figure: "between $79m and $270m"
    by: "The Guardian"
    date: "2026-09-22"
    where: "A Guardian analysis of the report covering July 2026"
    text: "Donald Trump made more than a thousand stock sales and purchases worth between $79m and $270m in July, according to a Guardian analysis of his latest financial disclosure released Tuesday."
    source_text:
      file: guardian-2026-09-22.txt
      span: [295, 483]
    source_url: https://www.theguardian.com/us-news/2026/sep/22/trump-stock-trades-july-filing
  - figure: "more trades than all of Congress combined"
    by: "The Guardian, citing Bloomberg"
    date: "2026-09-22"
    where: "The Guardian, on a Bloomberg analysis"
    text: "The president made more trades than all of Congress combined between the start of his second term and June, a Bloomberg analysis found."
    source_text:
      file: guardian-2026-09-22.txt
      span: [1658, 1793]
    source_url: https://www.theguardian.com/us-news/2026/sep/22/trump-stock-trades-july-filing
white_house:
  - by: "Davis Ingle, White House spokesperson"
    date: "2026-09-22"
    where: "Quoted by The Guardian"
    text: "All holdings are maintained in discretionary accounts and invested through computer-based model portfolios that automatically replicate recognized indexes, such as the Schwab 1000"
    source_text:
      file: guardian-2026-09-22.txt
      span: [992, 1171]
    source_url: https://www.theguardian.com/us-news/2026/sep/22/trump-stock-trades-july-filing
  - by: "Davis Ingle, White House spokesperson"
    date: "2026-09-22"
    where: "Quoted by The Guardian"
    text: "Neither President Trump nor any member of his family has any ability to direct, influence, or provide input regarding how the portfolio is invested or when investments are bought or sold. All investment decisions are made entirely by independent managers."
    source_text:
      file: guardian-2026-09-22.txt
      span: [1222, 1477]
    source_url: https://www.theguardian.com/us-news/2026/sep/22/trump-stock-trades-july-filing
