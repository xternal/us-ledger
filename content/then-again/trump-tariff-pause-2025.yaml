  where: "Exchange with reporters at a photo opportunity with NASCAR, IndyCar and IMSA champions, South Portico, the White House, after a reporter said he had ruled out a pause on Monday and asked how people could believe his word"
  text: "It's—yes, it's not a question of that. You have to have flexibility."
