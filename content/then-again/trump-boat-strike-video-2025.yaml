subject: "Releasing the video of the 2 September 2025 strike on a boat in the Caribbean"
first:
  date: "2025-12-03"
  venue: press_conference
  where: "Oval Office, remarks on fuel efficiency standards, answering: \"Will you release video of that strike so that the American people can see for themselves what happened?\" (the second strike on 2 September)"
  text: "I don't know what they have, but whatever they have, we'd certainly release. No problem."
  source_url: https://www.govinfo.gov/content/pkg/DCPD-202501158/html/DCPD-202501158.htm
