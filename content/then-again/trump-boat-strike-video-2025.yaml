later:
  date: "2025-12-08"
  venue: press_conference
  where: "Cabinet Room, roundtable on federal relief for farmers, answering: \"Mr. President, you said you would have no problem with releasing the full video of that strike on September 2 off the coast of Venezuela.\""
  text: "I didn't say that. That's—you said that. I didn't say that."
  source_url: https://www.govinfo.gov/content/pkg/DCPD-202501176/html/DCPD-202501176.htm
  source_text:
