format: openpromises/1
id: jeffries-reverse-medicaid-changes-2026
headline:
  en: "Reverse the 2025 law's changes to Medicaid"
actor_id: hakeem-jeffries
made_on: "2026-10-14"
venue: interview
venue_label:
  en: "MS NOW, The Weeknight (transcript published by the House Democratic Leader's office)"
area: other
status: promised
status_note:
  en: "Public Law 119-21 (4 July 2025) changes Medicaid in its chapter 1 of title VII: among other things, section 71119 requires states to set \"community engagement\" (work) requirements for certain adults, and sections 71103 to 71107 change how enrollment and eligibility are checked. The words do not say which of the changes would be reversed."
responsible:
  actor_id: us-congress
  note:
    en: "The words commit House Democrats if they win a majority in the House on 3 November 2026. A law needs both chambers and the President's signature, or two-thirds of each chamber to override a veto."
origin: manual
sources:
  - title: "Leader Jeffries on MS NOW's The Weeknight, 14 October 2026 (transcript, Office of the Democratic Leader)"
    url: https://democraticleader.house.gov/media/press-releases/leader-jeffries-ms-now-were-going-relentlessly-focus-our-affordability-agenda
  - title: "Public Law 119-21, chapter 1 of title VII (Medicaid), including section 71119"
    url: https://www.govinfo.gov/content/pkg/PLAW-119publ21/html/PLAW-119publ21.htm
