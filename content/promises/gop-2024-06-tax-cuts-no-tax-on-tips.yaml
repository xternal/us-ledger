format: openpromises/1
id: gop-2024-06-tax-cuts-no-tax-on-tips
headline:
  en: "Cut workers' taxes and end tax on tips"
actor_id: republican-party
made_on: "2024-07-15"
venue: platform
venue_label:
  en: 2024 Republican Platform, promise 6 of 20
area: taxes
status: delivering
status_note:
  en: "Treasury: more than 6 million filers claimed the new deduction for tips on their 2025 returns, averaging more than $7,100 (as of 14 April 2026). It is a deduction from federal income tax only, so Social Security and Medicare payroll taxes still apply to tips; it is capped at $25,000, reduced above $150,000 of income ($300,000 joint), and ends after 2028."
