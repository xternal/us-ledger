format: openpromises/1
id: trump-gaza-hostages-72-hours-2025
headline:
  en: "All Gaza hostages released within 72 hours"
actor_id: donald-trump
made_on: "2025-09-29"
venue: press_conference
venue_label:
  en: Joint appearance with Prime Minister Netanyahu at the White House, announcing the cease-fire proposal
area: peace
status: failed
status_note:
  en: "The 20 living hostages were released on 13 October 2025, which the President called \"on time, on schedule\". The remains of the deceased hostages were not all returned then: that day the President said \"some were brought in and some were not\", and the last were returned by 27 January 2026, when he said all hostages, living and dead, were back. Later phases of the plan (the Board of Peace, an international stabilization force, the disarmament of Hamas) were still in progress on 20 October 2026."
responsible:
  actor_id: us-administration
  note:
    en: "Hamas held the hostages; the US proposed the plan and mediated."
origin: manual
