  en: "The President took office on 20 January 2025. On 23 January he said soldiers were being killed on a daily basis and that it would be nice to end the war; on 12 February he announced that US and Russian teams would start negotiations. On 25 June 2025, asked about the pledge, he said: \"Of course it was sarcastic.\" There is no ceasefire or peace agreement between Russia and Ukraine; on 23 September 2026 the Secretary of State said a limited energy and grain ceasefire \"doesn't end the war\"."
