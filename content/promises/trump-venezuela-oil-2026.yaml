id: trump-venezuela-oil-2026
headline:
  en: "US to refine and sell Venezuelan crude"
actor_id: donald-trump
made_on: "2026-01-09"
venue: speech
venue_label:
  en: Meeting with oil and gas executives at the White House, with reporters present
area: other
status: delivering
status_note:
  en: "US imports of Venezuelan crude oil were 92.3 million barrels in January to July 2026, against 34.2 million in January to July 2025, and passed 50 million in May (EIA). EIA counts imports into the US, not every barrel the US Government sold; no official total of barrels sold or of the proceeds has been published. On 24 February 2026 the President said more than 80 million barrels had been received; EIA counts 12.7 million imported in January and February."
