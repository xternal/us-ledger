format: openpromises/1
id: trump-japan-550-billion-2025
headline:
  en: "Japan to invest $550 billion in the US"
actor_id: donald-trump
made_on: "2025-09-04"
venue: executive_order
venue_label:
  en: Executive Order 14345, Implementing the United States–Japan Agreement
area: manufacturing
status: in_plan
status_note:
  en: "By 19 March 2026 the White House had announced two tranches of Japanese investment under the agreement: three projects worth $36 billion in February 2026, then up to $40 billion for small modular reactors in Tennessee and Alabama and up to $33 billion for gas power plants in Pennsylvania and Texas. That is up to $109 billion selected, about a fifth of $550 billion. No official figure for money actually invested has been published by 20 October 2026, and the words give no end date."
responsible:
  actor_id: us-administration
  note:
    en: "Under the words, the US Government selects the investments and the Government of Japan provides them."
