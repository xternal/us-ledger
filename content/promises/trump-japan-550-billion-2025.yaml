    text: "Critically, unlike any other agreement in American history, the Government of Japan has agreed to invest $550 billion in the United States. These investments—which will be selected by the United States Government—will generate hundreds of thousands of United States jobs, expand domestic manufacturing, and secure American prosperity for generations."
