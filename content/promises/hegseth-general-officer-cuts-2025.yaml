versions:
  - version: 1
    text: "Therefore, I direct the following actions: • A minimum 20% reduction of 4-star positions across the Active Component; • A minimum 20% reduction of general officers in the National Guard; and • An additional minimum 10% reduction in general and flag officers with the realignment of the Unified Command Plan."
