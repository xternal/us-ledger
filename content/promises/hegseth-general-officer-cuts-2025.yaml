format: openpromises/1
id: hegseth-general-officer-cuts-2025
headline:
  en: "Cut four-star posts by at least 20%"
actor_id: pete-hegseth
made_on: "2025-05-05"
venue: statement
venue_label:
  en: "Memorandum to senior Pentagon leadership, \"General/Flag Officer Reductions\""
area: military
status: delivering
status_note:
  en: "On 30 September 2026 the Secretary said general officer posts had been cut by 10%, besides the 10% of generals and admirals he said had been dismissed. The War Department has published no count of four-star or National Guard general officer posts before and after the memo. The same speech created a new four-star command, Autonomous Warfare Command. The memo sets no deadline."
