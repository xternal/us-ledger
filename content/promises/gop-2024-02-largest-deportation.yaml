format: openpromises/1
id: gop-2024-02-largest-deportation
headline:
  en: "Largest deportation operation in American history"
actor_id: republican-party
made_on: "2024-07-15"
venue: platform
venue_label:
  en: 2024 Republican Platform, promise 2 of 20
area: deportation
status: delivering
status_note:
  en: "ICE recorded 356,389 removals in fiscal year 2026 up to 11 July 2026 (ICE detention statistics, 20 July 2026), more than the 319,980 it recorded in fiscal year 2025 up to 20 September 2025; ICE counts returns and expulsions as removals. The highest yearly count of removals in DHS's records, which list returns separately, is 432,334, in fiscal year 2013 (Yearbook of Immigration Statistics, table 39). No full-year figure for fiscal year 2026 is published yet."
