status_note:
  en: "No law or executive order that limits where American companies build data centers was found when this was recorded. The White House fact sheet of 18 November 2026 on the President's visit to Asia says a U.S. consortium will develop a sovereign Super Intelligence (SI) cloud for the Malaysian government, and that Brunei's Unified National Networks intends to award U.S. company Vertiv its Rimba Data Centre tender. The words do not say how the limit would be set, or whether it covers data centers already built or under contract abroad."
