format: openpromises/1
id: gop-2024-14-social-security-medicare
headline:
  en: "No cuts to Social Security or Medicare"
actor_id: republican-party
made_on: "2024-07-15"
venue: platform
venue_label:
  en: 2024 Republican Platform, promise 14 of 20
area: social_security
status: delivering
status_note:
  en: "The full retirement age remains 67 for people born in 1960 or later (42 U.S.C. 416(l)), and benefits rose by a 2.8% cost-of-living adjustment for 2026 (SSA). OMB found that no statutory PAYGO sequester, which would cut Medicare, was required for fiscal year 2026, after Congress reset the scorecards. Public Law 119-21 (section 71201) ends Medicare coverage for some lawfully present non-citizens 18 months after enactment, in January 2027."
