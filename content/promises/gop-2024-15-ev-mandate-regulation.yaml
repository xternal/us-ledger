format: openpromises/1
id: gop-2024-15-ev-mandate-regulation
headline:
  en: "Cancel the electric vehicle mandate; cut regulations"
actor_id: republican-party
made_on: "2024-07-15"
venue: platform
venue_label:
  en: 2024 Republican Platform, promise 15 of 20
area: regulation
status: delivering
status_note:
  en: "Federal greenhouse gas standards for vehicles are repealed from 20 April 2026 (EPA), California's waivers for its vehicle rules were disapproved by law in June 2025, and federal tax credits for electric vehicles ended for vehicles acquired after 30 September 2025. OMB counts 646 deregulatory actions and 5 significant new regulations in fiscal year 2025, with $211.8 billion in estimated savings (EO 14192 accounting). The words do not define the \"electric vehicle mandate\" or set a number of regulations to cut."
responsible:
  actor_id: us-administration
origin: manual
sources:
