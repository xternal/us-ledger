    url: https://prod-static.gop.com/media/RNC2024-Platform.pdf
  - title: "OMB/OIRA: final accounting for fiscal year 2025 under Executive Order 14192"
    url: https://www.reginfo.gov/public/pdf/eo14192/Final_Accounting_for_Fiscal_Year_2025_under_EO_14192.pdf
