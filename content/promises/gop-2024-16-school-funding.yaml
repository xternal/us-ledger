id: gop-2024-16-school-funding
headline:
  en: "Cut school funding over race and gender content"
actor_id: republican-party
made_on: "2024-07-15"
venue: platform
venue_label:
  en: 2024 Republican Platform, promise 16 of 20
area: schools
status: in_plan
status_note:
  en: "No official statistic counts schools whose federal funding was cut on these grounds, and no such case was found in official sources. A federal court vacated the Education Department's April 2025 demand that schools certify compliance as a condition of federal funds (AFT v. Department of Education, D. Md., 2025). On 15 October 2026 the Fourth Circuit recorded that Northern Virginia school districts the Department had designated \"high-risk\" over gender-identity policies \"have not been denied any funds\"."
