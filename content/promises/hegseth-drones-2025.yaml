status_note:
  en: "The War Department had ordered 30,000 small drones and shipped nearly 2,000 to the services by 17 June 2026, with 60,000 more to be ordered in September (Defense Innovation Unit). The department now aims to field more than 200,000 by 2027. No official count of drones delivered in 2026 as a whole has been published by 20 October 2026."
