id: gop-2024-19-election-rules
headline:
  en: "Voter ID, paper ballots and proof of citizenship"
actor_id: republican-party
made_on: "2024-07-15"
venue: platform
venue_label:
  en: 2024 Republican Platform, promise 19 of 20
area: elections
status: in_plan
status_note:
  en: "No law has been enacted. The House passed the SAVE Act, requiring proof of citizenship to register, on 10 April 2025 (220 to 208), and a revised version on 11 February 2026 (218 to 213); the Senate has held no final vote. A federal court permanently barred the proof-of-citizenship requirement in Executive Order 14248 on 31 October 2025. On 29 June 2026 the Supreme Court ruled, 5 to 4, in Watson v. RNC that federal Election Day law does not stop states counting mail ballots that arrive after Election Day. Over 98% of jurisdictions already used voting systems with a paper record of every vote (EAC, May 2025)."
