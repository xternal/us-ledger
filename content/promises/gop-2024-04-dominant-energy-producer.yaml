  en: 2024 Republican Platform, promise 4 of 20
area: energy
status: delivering
status_note:
  en: "EIA: US crude oil production averaged a record 13.6 million barrels a day in 2025, about 40% more than Russia or Saudi Arabia, and US dry natural gas production reached a record 113.7 billion cubic feet a day in July 2026 (released 30 September 2026). The US already led the world in crude oil (since 2018) and natural gas (since 2009) before 2025. In total primary energy, China produced more: 126.6 quadrillion Btu in 2023, against 102.8 for the US that year (107.2 in 2025, EIA)."
