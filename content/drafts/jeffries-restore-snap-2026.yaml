id: jeffries-restore-snap-2026
headline:
  en: "Restore SNAP funding in the first 100 days"
actor_id: hakeem-jeffries
made_on: "2026-11-04"
venue: statement
venue_label:
  en: "Letter to House Democrats announcing his candidacy for Speaker (published by the House Democratic Leader's office)"
area: other
status: promised
status_note:
  en: "Public Law 119-21 (4 July 2025) changes the Supplemental Nutrition Assistance Program (SNAP) in subtitle A of title I: among other things, section 10102 changes the work requirements for able-bodied adults, section 10105 requires states to pay a share of benefits, and section 10106 changes how administrative costs are shared. The words do not say which of the changes would be reversed. On 7 November 2026, on MS NOW, Jeffries said: \"We're going to work hard to reverse the Medicaid cuts, reverse the SNAP cuts.\""
responsible:
  actor_id: us-congress
  note:
    en: "The words commit House Democrats in the 120th Congress, which meets on 3 January 2027. A law needs both chambers and the President's signature, or two-thirds of each chamber to override a veto."
