id: gop-2024-11-rebuild-cities
headline:
  en: "Rebuild cities, including Washington DC"
actor_id: republican-party
made_on: "2024-07-15"
venue: platform
venue_label:
  en: 2024 Republican Platform, promise 11 of 20
area: cities
status: delivering
status_note:
  en: "DC police data: violent crime fell 29% in 2025 (2,475 offenses, against 3,475 in 2024), but from 1 January to 19 October 2026 it is 12% higher than a year earlier (2,294 against 2,050), with homicides down 27% and assaults with a dangerous weapon up 41% (MPD, as of 20 October 2026, preliminary, DC Code definitions). On 20 November 2025 a federal court found the National Guard deployment in Washington unlawful and stayed its own order. \"Clean\" and \"beautiful\" have no official measure, and no city other than Washington has comparable federal steps on this card."
