  - date: "2025-08-11"
    type: in_plan
    text:
      en: "Executive Order 14333 declares a crime emergency in Washington, DC and directs the Mayor to provide the Metropolitan Police for federal purposes under section 740 of the Home Rule Act"
    evidence_url: https://www.govinfo.gov/content/pkg/DCPD-202500843/html/DCPD-202500843.htm
  - date: "2025-08-11"
    type: delivering
    text:
      en: "A presidential memorandum mobilizes the DC National Guard; a federal court later records more than 2,000 Guard troops on the city's streets"
    evidence_url: https://www.govinfo.gov/content/pkg/DCPD-202500845/html/DCPD-202500845.htm
  - date: "2025-08-25"
    type: in_plan
    text:
      en: "Executive Order 14339 orders more Park Police and prosecutors for Washington, a specialized DC National Guard unit and a standing National Guard quick reaction force for use across the country"
    evidence_url: https://www.govinfo.gov/content/pkg/DCPD-202500866/html/DCPD-202500866.htm
  - date: "2025-09-15"
