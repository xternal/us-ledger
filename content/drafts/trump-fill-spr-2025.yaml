format: openpromises/1
id: trump-fill-spr-2025
headline:
  en: "Fill the Strategic Petroleum Reserve to the top"
actor_id: donald-trump
made_on: "2025-01-20"
venue: speech
venue_label:
  en: Inaugural address, 20 January 2025
area: energy
status: funded
status_note:
  en: "The Strategic Petroleum Reserve held 282.2 million barrels on 16 October 2026 (Department of Energy), against an authorized capacity of 714 million barrels. It held 394.6 million barrels on 17 January 2025 and about 415 million in March 2026 (EIA, DOE). From March 2026 DOE lent oil from the reserve in emergency exchanges, as part of the International Energy Agency's collective release of 400 million barrels; companies are to return it with additional barrels as a premium."
