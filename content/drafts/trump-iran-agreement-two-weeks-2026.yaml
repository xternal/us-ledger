headline:
  en: "Iran agreement finalized within two weeks"
actor_id: donald-trump
made_on: "2026-04-07"
venue: statement
venue_label:
  en: Statement on US military operations in Iran, announcing a two-week cease-fire
area: peace
status: failed
status_note:
  en: "No agreement was finalized by 21 April 2026; that day the President extended the cease-fire until Iran submits a proposal and talks conclude. On 24 June he said an agreement to end the conflict had been signed the week before; on 8 July he said \"As far as I'm concerned, it's over\"; on 2 August he called off planned strikes at the request of Saudi Arabia, the UAE, Qatar and Iran. The US struck Iran again from 1 September 2026 (presidential notice to Congress). No agreement text had been published by 20 October 2026. The cease-fire was conditional on Iran opening the Strait of Hormuz."
