  en: "PBS News Hour (transcript published by the House Democratic Leader's office)"
area: deportation
status: promised
status_note:
  en: "Public Law 119-21 (4 July 2025) already appropriates, to remain available until 30 September 2029, $45,000,000,000 to U.S. Immigration and Customs Enforcement for detention capacity (section 90003) and $29,850,000,000 to it for hiring, removals and other purposes (section 100052). The words do not say whether they cover only new appropriations or also the regular yearly funding of U.S. Immigration and Customs Enforcement."
responsible:
  actor_id: us-congress
  note:
    en: "The words commit House Democrats in the 120th Congress, which meets on 3 January 2027, with the House majority the elections of 3 November 2026 gave them (results not yet all certified when this was recorded). A law needs both chambers and the President's signature, or two-thirds of each chamber to override a veto."
