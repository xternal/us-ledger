format: openpromises/1
id: trump-warrior-dividend-2025
headline:
  en: "$1,776 to service members before Christmas"
actor_id: donald-trump
made_on: "2025-12-17"
venue: speech
venue_label:
  en: Address to the Nation on the economy
area: military
status: delivered
status_note:
  en: "The IRS confirms one-time payments of $1,776 made in December 2025, mainly to active-duty members in pay grades O-6 and below and to eligible reserve members on 30 November 2025, as a tax-free supplement to the housing allowance, paid from $2.9 billion appropriated in Public Law 119-21. The War Department said about 1.28 million active-duty and 174,000 reserve members would receive it before 20 December. The President named tariffs and the law as the source; the IRS names the appropriation."
