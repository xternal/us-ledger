format: openpromises/1
id: trump-drug-prices-2025
headline:
  en: "Drug prices down 30% to 80%, almost immediately"
actor_id: donald-trump
made_on: "2025-05-11"
venue: statement
venue_label:
  en: Statement on prescription drug costs, the evening before the most-favored-nation order
area: inflation
status: delivering
status_note:
  en: "The consumer price index for prescription drugs (BLS, US city average) was 543.556 in September 2026, 4.1% below May 2025 (566.716) and 4.5% below September 2025. By 31 August 2026, 26 manufacturers covering 89% of the branded drug market had signed most-favored-nation agreements (White House); TrumpRx.gov has listed discounted cash prices since 5 February 2026; the GLOBE model for Medicare Part B drugs takes effect on 30 November 2026. No official index of the prices paid through TrumpRx has been published."
responsible:
  actor_id: us-administration
origin: manual
sources:
  - title: "BLS: consumer price index, prescription drugs (series CUUR0000SEMF01)"
    url: https://data.bls.gov/timeseries/CUUR0000SEMF01
  - title: "Executive Order 14297: Delivering Most-Favored-Nation Prescription Drug Pricing to American Patients"
    url: https://www.federalregister.gov/documents/2025/05/15/2025-08876/delivering-most-favored-nation-prescription-drug-pricing-to-american-patients
  - title: "CMS: Global Benchmark for Efficient Drug Pricing (GLOBE) Model, final rule (2 October 2026)"
    url: https://www.federalregister.gov/documents/2026/10/02/2026-20281/global-benchmark-for-efficient-drug-pricing-globe-model
versions:
  - version: 1
    text: "Prescription drug and pharmaceutical prices will be reduced, almost immediately, by 30 percent to 80 percent."
    recorded_on: "2026-10-20"
    source_url: https://www.govinfo.gov/content/pkg/DCPD-202500589/html/DCPD-202500589.htm
    quote_checked_on: null
