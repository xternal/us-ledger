events:
  - date: "2025-05-11"
    type: promised
    text:
      en: "The President says prescription drug prices will fall by 30% to 80% almost immediately, under a most-favored-nation policy"
  - date: "2025-05-12"
    type: reworded
    text:
      en: "Signing the order, the President says some prices will fall almost immediately by 50% to 80% to 90%"
    evidence_url: https://www.govinfo.gov/content/pkg/DCPD-202500590/html/DCPD-202500590.htm
  - date: "2025-05-12"
    type: in_plan
    text:
      en: "Executive Order 14297 directs HHS to give drug makers most-favored-nation price targets within 30 days"
    evidence_url: https://www.federalregister.gov/documents/2025/05/15/2025-08876/delivering-most-favored-nation-prescription-drug-pricing-to-american-patients
  - date: "2025-07-31"
    type: in_plan
    text:
      en: "The President sends letters to leading drug makers setting out the steps they must take to most-favored-nation prices"
    evidence_url: https://www.whitehouse.gov/fact-sheets/2025/07/fact-sheet-president-donald-j-trump-announces-actions-to-get-americans-the-best-prices-in-the-world-for-prescription-drugs/
  - date: "2025-09-30"
    type: delivering
    text:
      en: "Pfizer signs the first most-favored-nation agreement, covering Medicaid prices, prices of new medicines and direct-to-patient discounts"
    evidence_url: https://www.whitehouse.gov/fact-sheets/2025/09/fact-sheet-president-donald-j-trump-announces-first-deal-to-bring-most-favored-nation-pricing-to-american-patients/
  - date: "2026-02-05"
    type: delivering
    text:
      en: "TrumpRx.gov opens, listing discounted cash prices for branded medicines"
    evidence_url: https://www.whitehouse.gov/fact-sheets/2026/02/fact-sheet-president-donald-j-trump-launches-trumprx-gov-to-bring-lower-drug-prices-to-american-patients/
  - date: "2026-08-31"
    type: delivering
    text:
      en: "Nine more agreements bring the drug makers with most-favored-nation deals to 26, covering 89% of the branded drug market"
    evidence_url: https://www.whitehouse.gov/fact-sheets/2026/08/fact-sheet-president-donald-j-trump-announces-deal-with-nine-additional-pharmaceutical-manufacturers-to-lower-drug-prices-for-americans/
