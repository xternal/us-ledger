status_note:
  en: "No agreement was reached that week. On 25 July 2025 the President said Hamas had pulled out of the negotiations. The 20 living hostages were released on 13 October 2025, and the remains of the last deceased hostage were returned by 27 January 2026, under the later plan the President announced on 29 September 2025. The words were a hope: \"we are hopeful\"."
