id: gop-2024-17-womens-sports
headline:
  en: "Keep women's sports for those born female"
actor_id: republican-party
made_on: "2024-07-15"
venue: platform
venue_label:
  en: 2024 Republican Platform, promise 17 of 20
area: sports
status: delivering
status_note:
  en: "No official statistic counts transgender athletes in women's sports. On 30 June 2026 the Supreme Court held that Title IX allows schools to keep women's and girls' teams for biological females (West Virginia v. B.P.J.); the ruling allows such rules but does not require them. No federal law was enacted: the House passed H.R. 28 by 218 to 206 in January 2025, and a Senate motion to end debate on S. 9 failed, 51 to 45, in March 2025."
