id: trump-credit-card-cap-2026
headline:
  en: "One-year 10% cap on credit card interest"
actor_id: donald-trump
made_on: "2026-01-11"
venue: press_conference
venue_label:
  en: Exchange with reporters aboard Air Force One
area: inflation
status: promised
status_note:
  en: "No law, rule or order capping credit card interest rates at 10% has been published by 20 October 2026. The two bills that would set the cap, S. 381 and H.R. 1944, were introduced in February and March 2025 and are still with the Senate Banking and House Financial Services committees (Congress.gov). On 22 January 2026 the President said of the cap: \"I'd like to see it.\""
responsible:
  actor_id: us-administration
  note:
    en: "The words say the Administration is putting the cap in place; bills that would set it in law (S. 381, H.R. 1944) are before Congress."
