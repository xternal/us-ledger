format: openpromises/1
id: jeffries-end-citizens-united-2026
headline:
  en: "End the Citizens United ruling on political spending"
actor_id: hakeem-jeffries
made_on: "2026-11-17"
venue: press_conference
venue_label:
  en: "Press conference in the Capitol (remarks published by the House Democratic Leader's office)"
area: elections
status: promised
status_note:
  en: "In Citizens United v. Federal Election Commission (21 January 2010) the Supreme Court held that the First Amendment bars the government from limiting independent political spending by corporations. A ruling on the Constitution is set aside only by a later ruling of the Court or by an amendment to the Constitution, which Congress proposes by two-thirds of each chamber and three-quarters of the states ratify (Article V). The words do not say which way."
responsible:
  actor_id: us-congress
  note:
    en: "The words commit House Democrats in the 120th Congress, which meets on 3 January 2027, with the House majority the elections of 3 November 2026 gave them. An amendment to the Constitution needs two-thirds of each chamber and ratification by three-quarters of the states, and no signature by the President; a law needs both chambers and the President's signature, or two-thirds of each chamber to override a veto."
