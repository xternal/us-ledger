format: openpromises/1
id: bessent-trump-accounts-2025
headline:
  en: "Trump Accounts take deposits from 4 July 2026"
actor_id: scott-bessent
made_on: "2025-12-17"
venue: speech
venue_label:
  en: Trump Accounts press conference at the Treasury
area: taxes
status: delivered
status_note:
  en: "The IRS says contributions to Trump Accounts began on 4 July 2026, up to $5,000 a year from individuals, with a one-time $1,000 federal contribution for each eligible child born from 2025 to 2028 (Public Law 119-21, section 70204). By 31 March 2026 more than 4 million children had been signed up, more than 1 million of them for the $1,000 contribution (IRS). No count of $1,000 deposits made since 4 July has been published by 20 October 2026."
