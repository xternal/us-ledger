headline:
  en: "A Haiti gang force of more than 5,000"
actor_id: mike-waltz
made_on: "2025-09-30"
venue: speech
venue_label:
  en: UN Security Council, after the vote on resolution 2793 on Haiti
area: other
status: delivering
status_note:
  en: "On 19 October 2026 the Ambassador said 2,000 troops of the Gang Suppression Force were on the ground in Haiti and 3,500 more were due in the coming months, against 5,500 authorized places; the Security Council renewed the mandate on 29 September 2026. The figures are the US Mission's; no UN deployment count was read."
responsible:
  actor_id: us-administration
  note:
    en: "Troops come from contributing countries under a UN Security Council mandate drafted by the US and Panama."
