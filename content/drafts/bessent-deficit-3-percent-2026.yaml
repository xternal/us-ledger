status_note:
  en: "The federal deficit was $1,992 billion in fiscal year 2026, October 2025 to September 2026, against $1,775 billion in fiscal year 2025 (Monthly Treasury Statement, September 2026). In February 2026, before the promise, the Congressional Budget Office projected 5.6% of GDP for fiscal year 2028 under the laws then in force."
