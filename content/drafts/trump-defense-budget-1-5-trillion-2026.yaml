format: openpromises/1
id: trump-defense-budget-1-5-trillion-2026
headline:
  en: "A $1.5 trillion defense budget for 2027"
actor_id: donald-trump
made_on: "2026-01-20"
venue: press_conference
venue_label:
  en: White House press briefing, with an exchange with reporters
area: military
status: in_plan
status_note:
  en: "The 2027 budget, sent to Congress on 3 April 2026, requests $1.5 trillion for defense: $1.1 trillion in regular appropriations for the War Department and $350 billion through a reconciliation bill, $445 billion more than 2026 (OMB). No 2027 defense appropriations act and no reconciliation act had become law by 9 October 2026 (Public Law 119-121). Public Law 119-103 keeps defense funding at 2026 rates until 11 December 2026. On 30 September 2026 the Secretary of War said the department \"will deliver\" the $1.5 trillion budget."
responsible:
  actor_id: us-congress
  note:
    en: "Appropriations and a reconciliation bill are passed by Congress; the Administration requested the amount."
origin: manual
sources:
  - title: "OMB: Fiscal Year 2027 Budget, topline fact sheet"
    url: https://www.whitehouse.gov/wp-content/uploads/2026/04/fiscal-year-2027-topline-fact-sheet.pdf
  - title: "Public Law 119-103: Continuing Appropriations and Extensions Act, 2027"
    url: https://www.govinfo.gov/content/pkg/PLAW-119publ103/html/PLAW-119publ103.htm
  - title: "Secretary of War Pete Hegseth's State of the Force Address (30 September 2026)"
    url: https://www.war.gov/News/Speeches/Speech/Article/4616486/secretary-of-war-pete-hegseths-state-of-the-force-address-as-delivered/
