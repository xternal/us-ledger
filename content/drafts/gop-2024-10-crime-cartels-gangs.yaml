  en: "The FBI estimates 327.6 violent crimes per 100,000 people in 2025, a rate 9.7% lower than in 2024, and 14,085 murders, 18.1% fewer (Reported Crimes in the Nation 2025, August 2026). No official statistic counts crimes by immigration status or measures cartel activity, and the words set no target figure."
