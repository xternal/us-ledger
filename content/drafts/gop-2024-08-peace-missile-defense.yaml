id: gop-2024-08-peace-missile-defense
headline:
  en: "Prevent world war, restore peace, build missile shield"
actor_id: republican-party
made_on: "2024-07-15"
venue: platform
venue_label:
  en: 2024 Republican Platform, promise 8 of 20
area: peace
status: funded
status_note:
  en: "Missile shield: Public Law 119-21 provides $24.4 billion for air and missile defense, including space-based interceptors; no shield is in service. Middle East: the Gaza ceasefire agreed in October 2025 holds; the US and Iran fought from 28 February to 7 April 2026 (OMB), and the US struck Iran again from 1 September 2026 (presidential notice to Congress). Europe: there is no ceasefire or peace agreement between Russia and Ukraine; on 23 September 2026 the Secretary of State said a limited energy and grain ceasefire \"doesn't end the war\". \"Prevent World War Three\" has no measure."
