format: openpromises/1
id: trump-dc-national-guard-2025
headline:
  en: "800 National Guard members for Washington DC"
actor_id: donald-trump
made_on: "2025-08-11"
venue: press_conference
venue_label:
  en: The President's news conference on crime in Washington DC
area: cities
status: delivered
status_note:
  en: "About 800 Army and Air National Guard members were activated in Washington DC by 14 August 2025 (War Department). About 4,700 Guard members from 19 states were serving in the DC task force on 25 June 2026; legislation before Congress would extend the mission to 2 January 2029. The memorandum keeps the mobilization in place until the President decides that law and order have been restored."
